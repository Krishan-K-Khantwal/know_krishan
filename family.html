    <style>
      :root {
        --bg-primary: #fffdf7;
        --bg-secondary: #fef08a;
        --text-dark: #121212;
        --accent-pink: #ff4071;
        --accent-cyan: #00e5ff;
        --accent-yellow: #ffe600;
        --accent-purple: #7000ff;
        --border-dark: #121212;
        --shadow-block: 6px 6px 0px #121212;
        --radius-sm: 8px;
        --radius-lg: 20px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Space Grotesk", sans-serif;
        background-color: var(--bg-primary);
        color: var(--text-dark);
        overflow-x: hidden;
      }

      /* Navbar */
      .navbar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 70px;
        background: var(--bg-primary);
        border-bottom: 3px solid var(--border-dark);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 5%;
        z-index: 100;
      }

      .brand {
        font-family: "Righteous", cursive;
        font-size: 1.6rem;
      }

      .btn-back {
        text-decoration: none;
        font-weight: 700;
        color: var(--text-dark);
        background: var(--accent-cyan);
        padding: 8px 18px;
        border: 2px solid var(--border-dark);
        box-shadow: 3px 3px 0px var(--border-dark);
        border-radius: var(--radius-sm);
        transition: all 0.15s ease;
      }

      .btn-back:hover {
        transform: translate(-2px, -2px);
        box-shadow: 5px 5px 0px var(--border-dark);
      }

      /* Header Layout */
      .page-header {
        margin-top: 120px;
        text-align: center;
        padding: 0 20px;
      }

      .badge-pop {
        display: inline-block;
        font-weight: 700;
        font-size: 0.85rem;
        padding: 6px 14px;
        border: 2px solid var(--border-dark);
        background: var(--accent-yellow);
        box-shadow: 2px 2px 0px var(--border-dark);
        margin-bottom: 16px;
      }

      h1 {
        font-family: "Righteous", cursive;
        font-size: 3.5rem;
        line-height: 1.2;
        margin-bottom: 40px;
      }

      /* Infinite Scroll Marquee Layout based on dd08a3c1-bf2b-4fd4-8aaa-a5a36f67843a */
      .family-section {
        margin-bottom: 60px;
      }

      .section-title {
        font-family: "Righteous", cursive;
        font-size: 1.8rem;
        padding-left: 5%;
        margin-bottom: 15px;
      }

      /* Warning styling for the last section */
      .warning-title {
        color: #fff;
        background: #dc2626;
        display: inline-block;
        padding: 10px 15px;
        border: 3px solid var(--border-dark);
        transform: rotate(-2deg);
        margin: 0px 0px 36px 48px;
      }

      .marquee-container {
        position: relative;
        width: 100vw;
        overflow: hidden;
        background: #ffffff;
        border-top: 4px solid var(--border-dark);
        border-bottom: 4px solid var(--border-dark);
        padding: 25px 0;
        display: flex;
        align-items: center;
      }

      /* Base track styles */
      .marquee-track {
        display: flex;
        gap: 24px;
        width: max-content;
        /* Animation applied via specific classes below */
      }

      .track-left {
        animation: scrollLeft 35s linear infinite;
      }

      .track-right {
        animation: scrollRight 35s linear infinite;
      }

      .marquee-container:hover .marquee-track {
        animation-play-state: paused;
      }

      /* Keyframes for seamless looping */
      @keyframes scrollLeft {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(-50%);
        }
      }

      @keyframes scrollRight {
        0% {
          transform: translateX(-50%);
        }
        100% {
          transform: translateX(0);
        }
      }

      /* Individual Photo Cards */
      .family-card {
        width: 180px;
        height: 180px;
        background: #e2e8f0;
        border: 3px solid var(--border-dark);
        border-radius: var(--radius-sm);
        box-shadow: 4px 4px 0px var(--border-dark);
        overflow: hidden;
        flex-shrink: 0;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        cursor: pointer;
      }

      .family-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
      }

      /* Fallback text if image is missing */
      .family-card::after {
        content: "PHOTO";
        position: absolute;
        font-weight: 700;
        color: #94a3b8;
        z-index: 0;
      }
      .family-card img {
        z-index: 1;
        position: relative;
      }

      .family-card:hover {
        transform: translateY(-8px) scale(1.05);
        box-shadow: 8px 8px 0px var(--border-dark);
      }

      @media (max-width: 900px) {
        h1 {
          font-size: 2.2rem;
        }
        .section-title {
          font-size: 1.4rem;
        }
        .family-card {
          width: 130px;
          height: 130px;
        }
        .marquee-container {
          padding: 15px 0;
        }
      }
    </style>
